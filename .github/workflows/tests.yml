name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evaluation-harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight deps
        # The evaluation harness depends only on numpy + scipy, so CI stays
        # fast — no Cellpose/PyTorch/scikit-image needed to run the tests.
        run: pip install numpy scipy -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/ -q
